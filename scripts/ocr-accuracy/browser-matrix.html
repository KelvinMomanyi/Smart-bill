<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Isolated SmartBill OCR matrix</title>
<h1>Isolated SmartBill OCR matrix</h1>
<p>Actual image/PDF recognition; synthetic originals; no Shopify or accounting credentials.</p>
<p id="progress" role="status">Ready</p><div id="root"></div>
<script type="module">
  import React from "react";
  import { createRoot } from "react-dom/client";
  import { useInvoiceOcr } from "/app/components/InvoiceOcr.tsx";
  import { processInvoiceInBrowser } from "/app/utils/browserOcr.ts";
  import { parseInvoiceText } from "/app/utils/parser.server.ts";
  import { parsedValues, compareInvoice } from "/scripts/ocr-accuracy/evaluate.ts";
  window.runFixture = async (fixture) => {
    const readings = [];
    if (window.Tesseract && !window.ocrTraceInstalled) {
      const create = window.Tesseract.createWorker.bind(window.Tesseract);
      window.Tesseract.createWorker = async (...args) => {
        const worker = await create(...args);
        const recognize = worker.recognize.bind(worker);
        worker.recognize = async (...args) => {
          const result = await recognize(...args);
          window.currentOcrReadings?.push({ text: result.data.text, confidence: result.data.confidence, options: args[1] });
          return result;
        };
        return worker;
      };
      window.ocrTraceInstalled = true;
    }
    window.currentOcrReadings = readings;
    const blob = await fetch("/ocr-fixtures/" + fixture.filename).then(response => response.blob());
    const result = await processInvoiceInBrowser(new File([blob], fixture.filename, { type: fixture.type }), value => {
      document.querySelector("#progress").textContent = value.status + " " + value.progress + "%";
    });
    const parsed = parseInvoiceText(result.rawText, "DMY");
    return { id: fixture.id, pageCount: result.pageCount, confidence: result.confidence, rawText: result.rawText, readings,
      parsed: parsedValues(parsed), warnings: parsed.warnings || [], comparison: compareInvoice(fixture.expected, parsedValues(parsed)) };
  };
  function Harness() {
    const ocr = useInvoiceOcr(() => {});
    return React.createElement("div", null,
      React.createElement("form", { onSubmit(event) { event.preventDefault(); const form = new FormData(event.currentTarget);
        void ocr.capture(form.getAll("file"), { vendorName: "MCP Matrix Supplies", purchaseOrderId: "" }); } },
        React.createElement("input", { type: "file", name: "file", "aria-label": "Invoice documents", disabled: ocr.busy }),
        React.createElement("button", { type: "submit", disabled: ocr.busy }, "Capture invoices")),
      React.createElement("button", { disabled: ocr.busy, onClick: () => void ocr.retry("fixture-job") }, "Retry processing"),
      React.createElement("p", { role: "status" }, ocr.busy ? ocr.progress.status : "Idle"),
      React.createElement("p", { role: "alert" }, ocr.error),
      React.createElement("pre", { id: "state" }, JSON.stringify({ busy: ocr.busy, error: ocr.error, saved: ocr.saved, rawText: ocr.preview?.rawText, pages: ocr.preview?.pageCount })));
  }
  createRoot(document.querySelector("#root")).render(React.createElement(Harness));
  window.harnessReady = true;
</script></html>
